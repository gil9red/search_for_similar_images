[project]
name = "search-for-similar-images"
version = "2026.9.8"
requires-python = ">=3.12"
dependencies = [
    "imagehash==4.3.2",
    "pyqt5==5.15.11",
    "python-dotenv==1.2.3",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]

[project.gui-scripts]
search-images = "search_for_similar_images.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'"
]
