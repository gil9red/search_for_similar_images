[project]
name = "search-for-similar-images"
version = "2026.9.9"
requires-python = ">=3.12"
dependencies = [
    "imagehash==4.3.2",
    "pyqt6==6.11.0",
    "python-dotenv==1.2.3",
    "show-in-file-manager==1.1.6",
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]

[project.gui-scripts]
search-images = "search_for_similar_images.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/"]
